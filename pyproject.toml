[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beamlab21"
version = "0.1.0"
description = "Beam generation and fitting tools for HIRAX (but extendable to other arrays)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Ajith Sampath", email = "ajithsampath1997@gmail.com" }
]
license = { text = "MIT license" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "matplotlib>=3.6",
  "astropy>=5.1",
  "pandas>=1.5",
  "h5py>=3.7",
  "tqdm>=4.64",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "nbstripout>=0.6"]

[project.scripts]
beamlab21 = "beamlab21.cli:main"
beamlab21-fit = "beamlab21.fit:main"
beamlab21-compute = "beamlab21.compute:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]  # ambiguous variable names (n, m, l) are standard in this domain

[tool.pytest.ini_options]
testpaths = ["tests"]
