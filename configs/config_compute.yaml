  # Configuration file for BEACH

  # Telescope parameters
  Telescope_name: "Hirax"  # free-text label for the array this data is from; not used to branch any behaviour
  frequency: 400  # frequency range in Hz
  aperture_diameter: 4.6   # effective aperture diameter in meters (sets the Gaussian model's theoretical lambda/D beamwidth); 4.6m is HIRAX's

  # Grid parameters
  pixels: 256       # number of pixels in x and y
  angular_res: 0.5858   # angular resolution in degrees. This sets the field of view (FOV = pixels * angular_res)
  dtype: float32    # numpy data type for array, use float128 if supported
  coord_type: "cartesian"  # output coordinate system: "cartesian" (default) or "polar"
                            # polar: x = r axis [0, FOV/2], y = theta axis [0, 2π)


  # Gaussian model parameters
  gen_gaussian_model: False  # whether to use a Gaussian model for the beam instead of Zernike polynomials
  gaussian_lamdabyD_coef: 1.03         # Coefficient for lambda/D to set the FWHM of the Gaussian beam
  gaussian_amp: 1.0          # Amplitude of the Gaussian beam
  gaussian_offset_x: 0.0   # x offset of the Gaussian beam
  gaussian_offset_y: 0.0   # y offset of the Gaussian beam
  gaussian_rotation: 0.0     # rotation angle of the Gaussian beam in degrees

  #adding noise
  add_noise2gaussian: False
  gaussian_noise_mean: 0.0
  gaussian_noise_sigma: 0.0        # noise level to add to the Gaussian beam
  gaussian_noise_random_seed: 42   # random seed for noise generation

  save_gaussian_model: True
  goutput_dir : "outputs"
  goutput_name: "ComputedGaussianModel_{{ frequency }}"  # output file name
  goutput_format: ".npz"      # output file format


  #Zernike model parameters
  #input parameters Coefficients and Scale parameters
  coef_dir: "outputs"
  coef_file: "coefficients_{{ frequency }}.csv" # input file with Zernike coefficients (in Noll notation). A sample file is provided.
  
  scaleparam_dir: "outputs"
  scaleparam_file: "scaleparameters_{{ frequency }}.csv"

  #adding noise
  gen_zernike_model: True  # whether to use Zernike polynomials for the beam
  add_noise2zernike: False
  zernike_noise_mean: 0.0
  zernike_noise_sigma: 0.0        # noise level to add to the Gaussian beam
  zernike_noise_random_seed: 42   # random seed for noise generation
  
  save_zernike_model: True
  zoutput_dir : "outputs"
  zoutput_name: "ComputedZernikeModel__{{ frequency }}"  # output file name
  zoutput_format: ".npz"      # output file format, options are "npz" or "npy"


  # Airy diffraction pattern parameters
  # Computes [2 J₁(u)/u]² for a circular aperture of diameter aperture_diameter (set above).
  gen_airy_pattern: False
  airy_blockage_diameter: 0.0  # secondary/subreflector diameter in metres (0 = unblocked)
  airy_offset_x: 0.0           # beam centre x offset in degrees
  airy_offset_y: 0.0           # beam centre y offset in degrees

  save_airy_pattern: True
  aoutput_dir: "outputs"
  aoutput_name: "ComputedAiryPattern_{{ frequency }}"
  aoutput_format: ".npz"
  

